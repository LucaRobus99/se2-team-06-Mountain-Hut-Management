server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Avatar uploads are JSON bodies of up to 768 KB.
    client_max_body_size 1m;

    # REST API → backend container (service name "backend" on the compose network).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts hashed, immutable files in /assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
